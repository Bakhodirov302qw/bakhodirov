<style>
:root{
  box-sizing:border-box;
  --bg1:#1d2150; --bg2:#0d0f1f;
  --card:#151a33; --card-line:#262c52;
  --text:#ffffff; --muted:#9aa0c4;
  --accent1:#5b6fe0; --accent2:#3e4cb8;
  --orb:#8f9df0;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg1:#e6e9ff; --bg2:#f6f7ff;
    --card:#ffffff; --card-line:#d6daf3;
    --text:#14183a; --muted:#5d648f;
  }
}
:root[data-theme="light"]{
  --bg1:#e6e9ff; --bg2:#f6f7ff; --card:#ffffff; --card-line:#d6daf3; --text:#14183a; --muted:#5d648f;
}
:root[data-theme="dark"]{
  --bg1:#1d2150; --bg2:#0d0f1f; --card:#151a33; --card-line:#262c52; --text:#ffffff; --muted:#9aa0c4;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100%;
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 75%) fixed;
  background-color:var(--bg2);
  color:var(--text);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto;padding:44px 20px 60px}

/* Hero */
.orb{
  width:150px;height:150px;margin:8px auto 0;border-radius:50%;
  border:4px solid var(--accent1);
  background:radial-gradient(circle at 62% 62%,var(--orb) 0%,var(--accent1) 45%,#4a5bd0 100%);
  box-shadow:0 0 60px rgba(91,111,224,.35);
  overflow:hidden;
}
.orb img{width:100%;height:100%;object-fit:cover;display:block;background:#070606}
h1{
  font-family:'Fraunces',Georgia,'Times New Roman',serif;
  font-weight:600;font-size:clamp(34px,10vw,48px);
  text-align:center;margin:34px 0 8px;letter-spacing:-.01em;line-height:1.1;
}
.bio{text-align:center;color:var(--muted);margin:0 auto;max-width:34ch;font-size:15px;line-height:1.5}

/* Section dividers */
.divider{
  display:flex;align-items:center;gap:16px;margin:40px 0 22px;
  color:var(--muted);font-size:14px;letter-spacing:.18em;text-transform:uppercase;
}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--card-line)}

/* Cards */
.item{margin-bottom:16px}
.card{
  display:flex;align-items:center;gap:18px;width:100%;
  padding:18px 22px 18px 20px;
  background:var(--card);border:1px solid var(--card-line);border-radius:30px;
  color:inherit;text-decoration:none;text-align:left;font:inherit;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:transform .15s ease,border-color .15s ease;
}
.card:active{transform:scale(.985)}
.card:hover{border-color:var(--accent1)}
.card:focus-visible{outline:2px solid var(--accent1);outline-offset:3px}
.ico{
  flex:none;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent1),var(--accent2));color:#fff;
}
.ico svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico svg.fill{fill:currentColor;stroke:none}
.txt{flex:1;min-width:0}
.t{display:block;font-size:21px;font-weight:600;line-height:1.25}
.s{display:block;font-size:17px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{flex:none;width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease}
.item.open .chev{transform:rotate(90deg)}

/* Expandable list */
.sub{display:none;margin:8px 8px 0;padding:6px;border:1px solid var(--card-line);border-radius:22px;background:var(--card)}
.item.open .sub{display:block}
.sub a{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 16px;border-radius:16px;color:inherit;text-decoration:none;font-size:17px;
}
.sub a span{color:var(--muted);font-size:15px}
.sub a:hover,.sub a:focus-visible{background:rgba(91,111,224,.16);outline:none}

/* Floating WhatsApp */
.fab{
  position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  width:82px;height:82px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,var(--accent1),var(--accent2));
  box-shadow:0 10px 36px rgba(91,111,224,.5);text-decoration:none;
}
.fab svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const CHEV = '<svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>';

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function cardInner(it){
  return `<span class="ico">${ICONS[it.icon]||ICONS.globe}</span>
    <span class="txt"><span class="t">${esc(it.title)}</span><span class="s">${esc(it.sub)}</span></span>${CHEV}`;
}
function render(list, mount){
  mount.innerHTML = "";
  list.forEach((it,i)=>{
    const wrap = document.createElement("div");
    wrap.className = "item";
    if(it.list){
      const id = mount.id + "-sub-" + i;
      wrap.innerHTML = `<button class="card" aria-expanded="false" aria-controls="${id}">${cardInner(it)}</button>
        <div class="sub" id="${id}">${it.list.map(l =>
          `<a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)}<span>${esc(l.value)}</span></a>`).join("")}</div>`;
      const btn = wrap.querySelector("button");
      btn.addEventListener("click", ()=>{
        const open = wrap.classList.toggle("open");
        btn.setAttribute("aria-expanded", open);
      });
    } else {
      wrap.innerHTML = `<a class="card" href="${esc(it.href)}" target="_blank" rel="noopener">${cardInner(it)}</a>`;
    }
    mount.appendChild(wrap);
  });
}

document.title = CONFIG.name + " — " + CONFIG.contactsTitle;

const bio = document.getElementById("bio");
CONFIG.bio ? bio.textContent = CONFIG.bio : bio.remove();

  const img = document.createElement("img");
  img.src = CONFIG.avatar; img.alt = CONFIG.name;
  document.getElementById("avatar").appendChild(img);
}
document.getElementById("h-contacts").textContent = CONFIG.contactsTitle;
document.getElementById("h-social").textContent = CONFIG.socialTitle;
render(CONFIG.contacts, document.getElementById("contacts"));
render(CONFIG.social, document.getElementById("social"));
